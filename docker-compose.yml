services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ajudanois-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  coordenador:
    build: ./cordenador-gerenciamento-service
    container_name: ajudanois-coordenador

    stdin_open: true
    tty: true

    environment:
      DB_URL: jdbc:mysql://db-coordenador:3306/coordenador_db
      DB_USER: coordenador
      DB_PASSWORD: ${DB_SENHA:-senha}

    depends_on:
      rabbitmq:
        condition: service_started
      db-coordenador:
        condition: service_healthy

  # ===================================================================
  # Bancos de dados: um MySQL por microsserviço.
  # Todos seguem o modelo database/_modelo/docker-compose.trecho.yml.
  # Como adicionar, resetar ou remover um banco: database/README.md
  # ===================================================================

  db-coordenador:                        # MS1 — gerenciamento
    image: mysql:8.4
    container_name: ajudanois-db-coordenador
    command: [--performance-schema=OFF, --innodb-buffer-pool-size=32M, --character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci]
    ports:
      - "3311:3306"
    environment:
      MYSQL_DATABASE: coordenador_db
      MYSQL_USER: coordenador
      MYSQL_PASSWORD: ${DB_SENHA:-senha}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_SENHA:-root_senha}
    volumes:
      - coordenador_data:/var/lib/mysql
      - ./database/ms1-coordenador:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  db-salas:                              # MS2 — salas
    image: mysql:8.4
