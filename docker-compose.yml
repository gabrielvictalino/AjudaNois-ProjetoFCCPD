    environment:
      MYSQL_DATABASE: salas_db
      MYSQL_USER: salas
      MYSQL_PASSWORD: ${DB_SENHA:-senha}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_SENHA:-root_senha}
    volumes:
      - salas_data:/var/lib/mysql
      - ./database/ms2-salas:/docker-entrypoint-initdb.d:ro
    healthcheck:
